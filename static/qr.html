<html>
    <head>
        <style>
            html, body {
                background: #000; 
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden; /* Prevents unwanted scrollbars */
            }

            body {
                display: flex;
                justify-content: center; /* Horizontally centers the child */
                width: 100vw;            /* Full screen width */
                min-height: 100vh;       /* Full screen height */
                margin: 0;
            }

            video {
                height: 100vh;
                width: auto;
                max-width: 100vw;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <video autoplay muted loop playsinline width="326" height="276" controls>
            <source src="image/kombucha-funny-meme.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    <script>
        // Replace with your actual YouTube Video ID
        const videoId = "dQw4w9WgXcQ"; 

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const fallbackUrl = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
        //const fallbackLinkElement = document.getElementById('fallback-link');

        // Configure the fallback button link just in case
        //fallbackLinkElement.href = fallbackUrl;

        setTimeout(() => {
            if (/android/i.test(userAgent)) {
                // Android: Use Chrome Intent syntax to force open the app or fall back to browser/Play Store
                window.location.href = `intent://://youtube.comdQw4w9WgXcQ#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(fallbackUrl)};end;`;
            } 
            else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // iOS: Try the custom URI scheme first
                window.location.href = `youtube://://youtube.comdQw4w9WgXcQ`;
                
                // If the app isn't installed, redirect to browser after a short delay
                setTimeout(() => {
                    window.location.href = fallbackUrl;
                }, 1500);
            } 
            else {
                // Desktop or other OS: Redirect to standard web URL
                window.location.href = fallbackUrl;
            }
            }, 12000);
    </script>
    </body>
</html>
