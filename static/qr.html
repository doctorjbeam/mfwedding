<html>
    <head>
        <style>
            html, body {
                background: #000; 
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden; /* Prevents unwanted scrollbars */
            }

            body {
                display: flex;
                justify-content: center; /* Horizontally centers the child */
                width: 100vw;            /* Full screen width */
                min-height: 100vh;       /* Full screen height */
                margin: 0;
            }

            video {
                height: 100vh;
                width: auto;
                max-width: 100vw;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <video id="video" autoplay muted loop playsinline width="326" height="276" controls>
            <source src="image/kombucha-funny-meme.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const video = document.getElementById("video"); // Change to your video's ID
            const VIDEO_LENGTH = 6; // Length of the video in seconds
            let redirectTriggered = false;

            if (!video) return;

            // Track actual video playback time so buffering doesn't ruin the countdown
            video.addEventListener("timeupdate", function () {
                if (video.currentTime >= VIDEO_LENGTH && !redirectTriggered) {
                    redirectTriggered = true;
                    video.pause();
                    redirectToYouTube();
                }
            });

            function redirectToYouTube() {
                const videoId = "dQw4w9WgXcQ"; // Replace with your actual YouTube Video ID
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;

                // Clean hardcoded URL bases with zero trailing issues
                const webUrl = "https://www.youtube.com/watch?v=" + videoId;
                const iosAppUrl = "youtube://www.youtube.com/watch?v=" + videoId;
                const androidIntent = "intent://www.youtube.com/watch?v=" + videoId + "#Intent;package=com.google.android.youtube;scheme=https;end;";

                // 1. Android Detection (Forces Brave & Chrome to hand off to the YouTube App)
                if (/Android/i.test(userAgent)) {
                    window.location.href = androidIntent;
                    return;
                }

                // 2. iOS Detection (iPhone/iPad/iPod)
                if (/iPhone|iPad|iPod/i.test(userAgent)) {
                    window.location.href = iosAppUrl;
                    
                    // If the user doesn't have the app installed, fall back to Safari/Web after 500ms
                    setTimeout(function () {
                        window.location.href = webUrl;
                    }, 500);
                    return;
                }

                // 3. Desktop / Everywhere Else Fallback
                window.location.href = webUrl;
            }
        });
